<div class="bg-gray-100 min-h-screen p-4 md:p-6">
  <div class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-12 gap-6">
    <aside class="hidden md:block md:col-span-3">
      <div class="bg-white rounded-2xl shadow-sm p-6 sticky top-6 space-y-4">
        <h2 class="text-lg font-semibold text-gray-700">Feed</h2>

        <nav class="space-y-2">
          <button
            class="w-full flex items-center gap-3 px-4 py-3 rounded-xl bg-blue-50 text-blue-600 font-medium"
          >
            <i class="fa-solid fa-newspaper"></i>
            Feed
          </button>

          <button
            class="w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-100 text-gray-600"
          >
            <i class="fa-solid fa-star"></i>
            My Posts
          </button>

          <button
            class="w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-100 text-gray-600"
          >
            <i class="fa-solid fa-users"></i>
            Community
          </button>

          <button
            class="w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-100 text-gray-600"
          >
            <i class="fa-solid fa-bookmark"></i>
            Saved
          </button>
        </nav>
      </div>
    </aside>

    <main class="col-span-1 md:col-span-6 space-y-6">
      @for (post of postList; track $index) {
        <div class="bg-white rounded-2xl shadow-md border border-gray-200 overflow-hidden">
          <!-- post header -->
          <div class="flex items-center justify-between p-4">
            <div class="flex items-center gap-3">
              <img [src]="post.user.photo" class="w-10 h-10 rounded-full object-cover" />
              <div>
                <h3 class="font-semibold text-gray-800">
                  {{ post.user.name }}
                </h3>
                <p class="text-sm text-gray-500">
                  {{ post.timeAgo }}
                </p>
              </div>
            </div>

            <button class="text-gray-400 hover:text-gray-600 text-xl">...</button>
          </div>

          <div class="px-4 pb-3">
            <p class="text-gray-700">
              {{ post.body }}
            </p>
          </div>

          <div class="w-full">
            <img [src]="post.image" class="w-full max-h-125 object-cover" />
          </div>

          <div class="flex justify-between items-center px-4 py-3 text-sm text-gray-500 border-t">
            <span>{{ post.likesCount }} likes</span>
            <div class="flex gap-4">
              <span>{{ post.sharesCount }} share</span>
              <span>{{ post.commentsCount }} comments</span>
            </div>
          </div>

          <div class="grid grid-cols-3 border-t text-sm">
            <button class="py-3 hover:bg-gray-100 font-medium text-gray-600">
              <i class="fa-solid fa-thumbs-up"></i> Like
            </button>

            <button #showcomments class="py-3 hover:bg-gray-100 font-medium text-gray-600">
              <i class="fa-regular fa-comment"></i> Comment
            </button>

            <button class="py-3 hover:bg-gray-100 font-medium text-gray-600">
              <i class="fa-solid fa-share-nodes"></i> Share
            </button>
          </div>

          @defer (on interaction(showcomments)) {
            <div class="p-4 border-t bg-gray-50">
              <app-comments [postId]="post._id"></app-comments>
            </div>
          }
        </div>
      }
    </main>

    <aside class="hidden md:block md:col-span-3">
      <div class="bg-white rounded-2xl shadow-sm p-6 sticky top-6">
        <h2 class="font-semibold text-gray-700 mb-4">Suggested Friends</h2>

        <div class="flex items-center justify-between mb-4">
          <div class="flex items-center gap-3">
            <img src="images/default-profile.png" class="w-10 h-10 rounded-full object-cover" />
            <div>
              <h4 class="text-sm font-semibold">Saif</h4>
              <p class="text-xs text-gray-400">70 followers</p>
            </div>
          </div>

          <button
            class="text-sm px-4 py-1 bg-blue-100 text-blue-600 rounded-full hover:bg-blue-200"
          >
            Follow
          </button>
        </div>
      </div>
    </aside>
  </div>
</div>
