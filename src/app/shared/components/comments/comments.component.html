@for (comment of commentList; track comment._id) {
  <section class="p-5 rounded-lg border border-gray-100 bg-gray-50">
    <div class="p-3 flex justify-between">
      <div class="flex gap-2.5 items-center">
        <img
          class="size-10 rounded-full"
          [src]="comment.commentCreator.photo"
          [alt]="comment.commentCreator.name"
        />
        <div>
          <h2 class="font-bold">{{ comment.commentCreator.name }}</h2>
          <p class="text-gray-500">{{ comment.createdAt }}</p>
          @if (comment.image) {
            <div class="mt-3 px-3">
              <img
                [src]="comment.image"
                alt="Comment image"
                class="max-w-full max-h-96 rounded-lg object-cover border border-gray-200"
                (click)="openImageModal(comment.image)"
              />
            </div>
          }
        </div>
      </div>
      <div><i class="fa-solid fa-ellipsis cursor-pointer"></i></div>
    </div>

    <p class="text-gray-600">{{ comment.content }}</p>

    <div class="flex gap-2">
      <button class="py-3 hover:bg-gray-100 transition font-medium text-gray-600 text-xs">
        <i class="fa-solid fa-thumbs-up"></i> Like
      </button>
      <button class="py-3 hover:bg-gray-100 transition font-medium text-gray-600 text-xs">
        <i class="fa-regular fa-comment"></i> Reply
      </button>
    </div>
  </section>
}

@if (isModalOpen()) {
  <div
    class="fixed inset-0 bg-black bg-opacity-75 z-50 flex items-center justify-center p-4"
    (click)="closeImageModal()"
  >
    <div class="relative max-w-4xl max-h-screen cursor-pointer">
      <img
        [src]="selectedImage()"
        alt="Enlarged comment image"
        class="max-w-full max-h-screen object-contain rounded-lg"
        (click)="$event.stopPropagation()"
      />
      <button
        class="absolute top-4 right-4 bg-white rounded-full w-10 h-10 flex items-center justify-center hover:bg-gray-200 transition cursor-pointer"
        (click)="closeImageModal()"
      >
        <i class="fa-solid fa-times text-xl"></i>
      </button>
    </div>
  </div>
}
