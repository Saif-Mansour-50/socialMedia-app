@if (post) {
  <div
    class="max-w-2xl mx-auto mb-7 bg-white rounded-2xl shadow-md border border-gray-200 overflow-hidden"
  >
    <div class="flex items-center justify-between p-4">
      <div class="flex items-center gap-3">
        <img [src]="post.user.photo" class="w-10 h-10 rounded-full object-cover" alt="avatar" />
        <div>
          <h3 class="font-semibold text-gray-800">{{ post.user.name }}</h3>
          <p class="text-sm text-gray-500">{{ post.timeAgo }}</p>
        </div>
      </div>

      <button class="text-gray-400 hover:text-gray-600 text-xl">...</button>
    </div>

    <div class="px-4 pb-3">
      <p class="text-gray-700">{{ post.body }}</p>
    </div>

    <div class="w-full cursor-pointer">
      <img [src]="post.image" class="w-full h100 object-cover" alt="post image" />
    </div>

    <div class="flex justify-between items-center px-4 py-3 text-sm text-gray-500 border-t">
      <span> {{ post.likesCount }} likes </span>
      <div class="flex gap-4">
        <span>{{ post.sharesCount }} sheare</span>
        <span> {{ post.commentsCount }} comments</span>
      </div>
    </div>

    <div class="grid grid-cols-3 border-t">
      <button class="py-3 hover:bg-gray-100 transition font-medium text-gray-600">
        <i class="fa-solid fa-thumbs-up"></i> Like
      </button>
      <button
        #showcomments
        class="py-3 hover:bg-gray-100 transition font-medium text-gray-600 cursor-pointer"
      >
        <i class="fa-regular fa-comment"></i> Comment
      </button>
      <button class="py-3 hover:bg-gray-100 transition font-medium text-gray-600">
        <i class="fa-solid fa-share-nodes"></i> Share
      </button>
    </div>

    @defer (on interaction(showcomments)) {
      <app-comments [postId]="post._id"></app-comments>
      <div class="">
        <form>
          <label for="chat" class="sr-only">Your message</label>
          <div class="flex items-center px-3 py-2 rounded-base bg-neutral-secondary-soft">
            <button
              type="button"
              class="p-2 text-body rounded-sm cursor-pointer hover:text-heading hover:bg-neutral-tertiary-medium"
            >
              <svg
                class="w-5 h-5"
                aria-hidden="true"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                fill="none"
                viewBox="0 0 24 24"
              >
                <path
                  fill="currentColor"
                  d="M16 18H8l2.5-6 2 4 1.5-2 2 4Zm-1-8.5a.5.5 0 1 1-1 0 .5.5 0 0 1 1 0Z"
                />
                <path
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M10 3v4a1 1 0 0 1-1 1H5m14-4v16a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7.914a1 1 0 0 1 .293-.707l3.914-3.914A1 1 0 0 1 9.914 3H18a1 1 0 0 1 1 1ZM8 18h8l-2-4-1.5 2-2-4L8 18Zm7-8.5a.5.5 0 1 1-1 0 .5.5 0 0 1 1 0Z"
                />
              </svg>
              <span class="sr-only">Upload image</span>
            </button>

            <button
              type="button"
              class="p-2 text-body rounded-sm cursor-pointer hover:text-heading hover:bg-neutral-tertiary-medium"
            >
              <svg
                class="w-5 h-5"
                aria-hidden="true"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                fill="none"
                viewBox="0 0 24 24"
              >
                <path
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M15 9h.01M8.99 9H9m12 3a9 9 0 1 1-18 0 9 9 0 0 1 18 0ZM6.6 13a5.5 5.5 0 0 0 10.81 0H6.6Z"
                />
              </svg>
              <span class="sr-only">Add emoji</span>
            </button>
            <textarea
              id="chat"
              rows="1"
              class="mx-4 bg-neutral-primary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 placeholder:text-body"
              placeholder="Your message..."
            ></textarea>
            <button
              type="submit"
              class="inline-flex justify-center p-2 text-fg-brand rounded-full cursor-pointer hover:bg-brand-softer"
            >
              <svg
                class="w-6 h-6 rotate-90 rtl:-rotate-90"
                aria-hidden="true"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                fill="none"
                viewBox="0 0 24 24"
              >
                <path
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="m12 18-7 3 7-18 7 18-7-3Zm0 0v-5"
                />
              </svg>
              <span class="sr-only">Send message</span>
            </button>
          </div>
        </form>
      </div>
    }
  </div>
}
